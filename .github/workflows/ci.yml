name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  release-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            curl \
            redis-tools

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DMINIREDIS_ENABLE_INTEGRATION_TESTS=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Recovery / soak smoke
        run: REQUESTS=1000 CLIENTS=5 scripts/recovery_soak.sh

      - name: Resource / failure smoke
        run: REQUESTS=1000 CLIENTS=5 scripts/resource_failure_soak.sh

  sanitizer-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            curl \
            redis-tools

      - name: Configure ASan UBSan
        run: |
          cmake -S . -B build-sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMINIREDIS_ENABLE_INTEGRATION_TESTS=ON \
            -DMINIREDIS_ENABLE_ASAN=ON \
            -DMINIREDIS_ENABLE_UBSAN=ON

      - name: Build ASan UBSan
        run: cmake --build build-sanitize -j"$(nproc)"

      - name: Full test suite under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure

  docker-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t miniredis:ci .

  platform-boundary:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake

      - name: Check platform build boundary
        run: scripts/check_platform_build.sh

  desktop-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/desktop/package-lock.json
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake curl redis-tools python3 xvfb xauth \
            libgtk-3-0 libnss3 libasound2t64 libgbm1 fonts-noto-cjk
          npm ci --prefix tools/desktop
      - name: Build server for desktop integration
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DMINIREDIS_BUILD_TESTS=OFF -DMINIREDIS_ENABLE_MYSQL_DISCOVERY=OFF
          cmake --build build -j"$(nproc)"
      - name: Desktop backend tests
        env:
          MINIREDIS_TEST_BINARY: ../../build/miniredis
        run: npm run test:coverage --prefix tools/desktop
      - name: Build desktop
        run: npm run build --prefix tools/desktop
      - name: Package desktop
        working-directory: tools/desktop
        run: npx electron-builder --dir
      - name: Desktop UI workflows
        env:
          MINIREDIS_TEST_NO_SANDBOX: '1'
          MINIREDIS_TEST_ELECTRON: ${{ github.workspace }}/tools/desktop/release/linux-unpacked/miniredis-desktop
          MINIREDIS_SCREENSHOTS: /tmp/miniredis-desktop-screens
          MINIREDIS_QA_OUTPUT: /tmp/miniredis-desktop-screens
        run: |
          xvfb-run -a npm run test:desktop --prefix tools/desktop
          xvfb-run -a npm run test:branches --prefix tools/desktop
      - name: Upload desktop diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots
          path: /tmp/miniredis-desktop-screens
